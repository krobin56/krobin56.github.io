    <main>
        <h2>Fizz Buzz 2</h2>
        <h3>More Like a Taco Fizz Buzz 2</h3>

        <h3 id="greeting">Welcome to More Like a Taco!</h3>

        <form id="name-form">
            <p>
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name"
                       placeholder="Enter your first name" required>
            </p>

            <p>
                <label for="middle_initial">Middle Initial:</label>
                <input type="text" id="middle_initial"
                       maxlength="1" placeholder="M">
            </p>

            <p>
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name"
                       placeholder="Enter your last name" required>
            </p>

            <p>
                <label for="count">How high would you like to count?</label>
                <input type="number" id="count"
                       min="1" value="140" required>
            </p>

            <button type="submit">Run Fizz Buzz</button>
        </form>

        <h3>Results</h3>
        <div id="results"></div>
    </main>
